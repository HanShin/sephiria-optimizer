name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows recognition and optimizer tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: node scripts/version.mjs check
      - run: npm ci
        working-directory: windows
      - run: npm test
        working-directory: windows

  macos:
    name: macOS tests
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/version.mjs check
      - name: Run Swift tests
        env:
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/sephiria-clang-cache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/sephiria-swiftpm-module-cache
        run: swift test --disable-sandbox --cache-path "${{ runner.temp }}/sephiria-swiftpm-cache"
